services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kelurahan_bot
      MYSQL_USER: kelurahan
      MYSQL_PASSWORD: kelurahan
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3316:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8091:8080"
    depends_on:
      - db

volumes:
  db_data:
